[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v -s --alluredir ./report --clean-alluredir
markers =
    ui: browser-based UI test requiring the local Shortlink frontend
    e2e: cross-domain end-to-end business workflow
    persistent_data: test creates persistent SUT data because no supported cleanup API exists yet
    regression: slower or interaction-sensitive regression coverage excluded from basic smoke flows
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s - %(levelname)s - %(message)s
filterwarnings =
    ignore::DeprecationWarning
